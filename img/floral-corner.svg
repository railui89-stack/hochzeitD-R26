<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- Blätter -->
  <path d="M10,10 C40,20 55,45 60,75 C40,60 20,45 10,10 Z" fill="#A9C08B" opacity="0.55" filter="url(#soft)"/>
  <path d="M10,10 C25,35 45,50 78,58 C55,52 30,42 10,10 Z" fill="#88A96E" opacity="0.45" filter="url(#soft)"/>
  <path d="M15,55 C35,60 50,72 55,95 C38,85 22,72 15,55 Z" fill="#B7CBA0" opacity="0.5" filter="url(#soft)"/>

  <!-- Blüte gelb -->
  <g transform="translate(52,30)">
    <circle cx="0" cy="-10" r="9" fill="#F5D98B" opacity="0.85" filter="url(#soft)"/>
    <circle cx="9" cy="-3" r="9" fill="#F5D98B" opacity="0.85" filter="url(#soft)"/>
    <circle cx="6" cy="8" r="9" fill="#F5D98B" opacity="0.85" filter="url(#soft)"/>
    <circle cx="-6" cy="8" r="9" fill="#F5D98B" opacity="0.85" filter="url(#soft)"/>
    <circle cx="-9" cy="-3" r="9" fill="#F5D98B" opacity="0.85" filter="url(#soft)"/>
    <circle cx="0" cy="0" r="5" fill="#C98F4A" opacity="0.9"/>
  </g>

  <!-- Blüte rosa -->
  <g transform="translate(95,20)">
    <circle cx="0" cy="-8" r="7" fill="#F1B8BE" opacity="0.8" filter="url(#soft)"/>
    <circle cx="7" cy="-2" r="7" fill="#F1B8BE" opacity="0.8" filter="url(#soft)"/>
    <circle cx="4" cy="6" r="7" fill="#F1B8BE" opacity="0.8" filter="url(#soft)"/>
    <circle cx="-4" cy="6" r="7" fill="#F1B8BE" opacity="0.8" filter="url(#soft)"/>
    <circle cx="-7" cy="-2" r="7" fill="#F1B8BE" opacity="0.8" filter="url(#soft)"/>
    <circle cx="0" cy="0" r="3.5" fill="#E38A8F" opacity="0.9"/>
  </g>

  <!-- Blüte blau, kleiner -->
  <g transform="translate(30,68)">
    <circle cx="0" cy="-6" r="5.5" fill="#AFC9E3" opacity="0.8" filter="url(#soft)"/>
    <circle cx="5.5" cy="-1.5" r="5.5" fill="#AFC9E3" opacity="0.8" filter="url(#soft)"/>
    <circle cx="3" cy="5" r="5.5" fill="#AFC9E3" opacity="0.8" filter="url(#soft)"/>
    <circle cx="-3" cy="5" r="5.5" fill="#AFC9E3" opacity="0.8" filter="url(#soft)"/>
    <circle cx="-5.5" cy="-1.5" r="5.5" fill="#AFC9E3" opacity="0.8" filter="url(#soft)"/>
    <circle cx="0" cy="0" r="2.6" fill="#7C97C2" opacity="0.9"/>
  </g>

  <!-- kleine Streublüten -->
  <circle cx="78" cy="70" r="3.2" fill="#F0B79A" opacity="0.75" filter="url(#soft)"/>
  <circle cx="90" cy="50" r="2.4" fill="#F1B8BE" opacity="0.7" filter="url(#soft)"/>
  <circle cx="18" cy="35" r="2.2" fill="#F5D98B" opacity="0.7" filter="url(#soft)"/>
