<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anna &amp; Thomas – Unsere Hochzeit</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="gate">
    <div class="gate-card">
      <img src="img/monogram.svg" alt="" class="monogram">
      <span class="eyebrow">Herzlich willkommen</span>
      <h1>Anna &amp; Thomas</h1>
      <p style="opacity:.8;">Diese Seite ist nur für unsere Gäste gedacht.<br>Das Passwort findet ihr auf eurer Einladung.</p>

      <form id="gate-form" class="gate-form" autocomplete="off">
        <label for="gate-password" class="eyebrow" style="text-align:center;">Passwort</label>
        <input
          type="password"
          id="gate-password"
          name="password"
          required
          autofocus
          placeholder="••••••••">
        <p id="gate-error" class="gate-error" role="alert" aria-live="polite"></p>
        <button type="submit" class="btn">Eintreten</button>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
